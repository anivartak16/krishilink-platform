server:
  port: 8084

spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:mysql://localhost:3306/krishilink_trade?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:9926883877}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

krishilink:
  jwt:
    secret: krishilink-super-secret-key-for-jwt-tokens-must-be-very-long-and-secure-32bytes

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
