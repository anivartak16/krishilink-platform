server:
  port: 5000

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service-auth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: user-service-fpo
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/fpo/**
        - id: user-service-buyers
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/buyers/**
        - id: user-service-users
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: lot-service-lots
          uri: lb://LOT-SERVICE
          predicates:
            - Path=/api/lots/**
        - id: lot-service-inspections
          uri: lb://LOT-SERVICE
          predicates:
            - Path=/api/inspections/**
        - id: demand-service-demands
          uri: lb://DEMAND-SERVICE
          predicates:
            - Path=/api/demands/**
        - id: demand-service-matches
          uri: lb://DEMAND-SERVICE
          predicates:
            - Path=/api/matches/**
        - id: trade-service-offers
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/offers/**
        - id: trade-service-transactions
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/transactions/**
        - id: trade-service-payments
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: trade-service-disputes
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/disputes/**
        - id: market-service-marketprice
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/marketPrice/**
        - id: market-service-prices
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/prices/**
        - id: market-service-markets
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/markets/**
        - id: market-service-predictions
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/predictions/**
        - id: market-service-storage
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/storage/**
        - id: market-service-logistics
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/logistics/**
        - id: market-service-notifications
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/notifications/**
        - id: market-service-dashboard
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/dashboard/**
        - id: market-service-admin
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/admin/**
        - id: market-service-chat
          uri: lb://MARKET-SERVICE
          predicates:
            - Path=/api/chat/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
