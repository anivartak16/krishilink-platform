# ===================================================================
# KrishiLink Spring Boot - Common Base Configuration
# ===================================================================

spring.application.name=krishilink-backend
server.port=5000

# Default active profile (Can be overridden via SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA Common Settings
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
