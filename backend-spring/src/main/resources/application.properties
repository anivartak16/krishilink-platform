# ===================================================================
# KrishiLink Spring Boot - Common Base Configuration
# ===================================================================

spring.application.name=krishilink-backend
server.port=5000

# Default active profile (Can be overridden via SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA Common Settings
spring.jpa.open-in-view=true

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
# Existing databases created by ddl-auto are baselined at V1 and receive later migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Market-price cache: in-memory by default; set CACHE_TYPE=redis and REDIS_URL to share it across instances.
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
krishilink.cache.price-ttl=${PRICE_CACHE_TTL:PT10M}
krishilink.cache.msp-ttl=${MSP_CACHE_TTL:PT6H}
# Report Redis in /actuator/health only when the cache actually uses it.
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# Actuator: only health and info are exposed over HTTP; health details are visible to admins only.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.api-version=v1
