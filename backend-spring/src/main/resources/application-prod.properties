# ===================================================================
# KrishiLink Spring Boot - PRODUCTION / Deployment Profile
# Activate with: --spring.profiles.active=prod
# or Environment Variable: SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# Cloud platform dynamic port ($PORT provided by Render, Railway, AWS ECS, GCP Cloud Run, Heroku)
server.port=${PORT:5000}

# Production MySQL Database Configuration (Injected via Environment Variables)
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/krishilink?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production JWT Configuration (Must be securely supplied in environment)
krishilink.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
krishilink.jwt.expiration-ms=${JWT_EXPIRATION:604800000}

# Production CORS Allowed Origins
krishilink.cors.allowed-origins=${CLIENT_URL:https://krishilink-three.vercel.app},https://krishilink-three.vercel.app,http://localhost:5173

# Production Logging (Optimized for performance)
logging.level.root=INFO
logging.level.com.krishilink=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# AGMARKNET / data.gov.in credentials (set AGMARKNET_API_KEY in the deployment environment)
agmarknet.api-key=${AGMARKNET_API_KEY:}
agmarknet.resource-id=${AGMARKNET_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
