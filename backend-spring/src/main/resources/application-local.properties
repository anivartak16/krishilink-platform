# ===================================================================
# KrishiLink Spring Boot - LOCAL Development Profile
# Activate with: --spring.profiles.active=local (Default)
# ===================================================================

server.port=5000

# Local MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/krishilink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Local Development Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Local Development Secret
# Local development only. Set JWT_SECRET to override.
krishilink.jwt.secret=${JWT_SECRET:adde1d3c4fdf973c09164c866de2ee713f419e19eb90f689d36caf2f7374595f}
krishilink.jwt.expiration-ms=604800000

# Local CORS Allowed Origins (Vite React frontend, Next.js, local ports)
krishilink.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Logging for Local Debugging
logging.level.com.krishilink=DEBUG
logging.level.org.springframework.web=INFO
